@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn[wght].woff2) format("woff2-variations");font-weight:100 900;font-display:swap}
:root,html[data-theme=dark]{--bg:#121315;--card:#1a1b1e;--card2:#202125;--bd:rgba(255,255,255,.07);--fg:#fafafa;--mut:#8d919c;--pri:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--hold:#3b82f6;--grid:rgba(255,255,255,.035);--glow:rgba(37,99,235,.16);--r:14px;color-scheme:dark}
html[data-theme=light]{--bg:#f5f6f8;--card:#fff;--card2:#f3f4f7;--bd:rgba(0,0,0,.09);--fg:#0b0c0f;--mut:#6a6f7b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--hold:#2563eb;--grid:rgba(0,0,0,.035);--glow:rgba(59,130,246,.1);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden;background:transparent}
body.lock{overflow:hidden}
button,a{font:inherit;color:inherit}a{text-decoration:none}svg{display:block}button{-webkit-user-select:none;user-select:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 45% at 12% 38%,var(--glow),transparent 72%),radial-gradient(50% 40% at 88% 78%,var(--glow),transparent 72%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.meta{display:flex;align-items:center;gap:9px;margin-top:5px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.meta .u{unicode-bidi:plaintext}
.meta .o{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--mut)}
.meta .o i{width:7px;height:7px;border-radius:50%;background:currentColor}
.meta .o.up{color:var(--ok)}.meta .o.dn{color:var(--bad)}
.tools{display:flex;gap:8px;flex:none}

.ib.sm{width:24px;height:24px;border-radius:7px;border-color:transparent;background:none}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.lab{font-size:11.5px;color:var(--mut)}
.top{display:grid;grid-template-columns:1fr;gap:12px}
.st{--sc:var(--ok);overflow:hidden;padding:20px;border-color:transparent}
.st.warn{--sc:var(--warn)}.st.bad{--sc:var(--bad)}.st.hold{--sc:var(--hold)}
.st::before{content:"";position:absolute;inset:0;background:var(--sc);opacity:.11;pointer-events:none}
.st::after{content:"";position:absolute;inset:0;border:1px solid var(--sc);border-radius:inherit;opacity:.32;pointer-events:none}
.st>*{position:relative;z-index:1}
.sth{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stt{display:flex;align-items:center;gap:9px;font-size:27px;font-weight:800;color:var(--sc);line-height:1.25}
.stt i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pu 2s infinite;flex:none}

.sth .lab{margin-top:2px}

.rows{flex:1;min-width:0;display:grid;gap:11px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.rw b{color:var(--fg);font-weight:700;white-space:nowrap}
.rw.g b{color:var(--sc)}
.side{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.side>:last-child{grid-column:1/-1}
.sc{padding:14px 16px}
.sc .lab{margin-bottom:8px}
.sc .v{display:block;font-size:19px;font-weight:800;line-height:1.3}
.sc .v.d{font-size:15px;font-weight:700;line-height:1.7}

.pr{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pr .q{font-size:12px;font-weight:600;color:var(--mut)}
/* notes */
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:11px;font-size:13px;line-height:1.8;border:1px solid}
.note svg{flex:none;margin-top:3px}
.note.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.32);color:var(--warn)}
.note.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.32);color:var(--bad)}

.main{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"sub" "apps" "cfg" "help" "tg"}
.a-sub{grid-area:sub}.a-apps{grid-area:apps}.a-cfg{grid-area:cfg}.a-help{grid-area:help}.a-tg{grid-area:tg}
.h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin:0 0 13px}
.h>svg{color:var(--mut);flex:none}

.btn.wide{display:flex;width:100%;padding:11px 14px}
.lk{display:flex;align-items:center;gap:8px;padding:5px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);direction:ltr}
.lk code{flex:1;min-width:0;padding-left:9px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.qrw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.qrw.on{grid-template-rows:1fr}
.qrw>div{overflow:hidden;min-height:0}
.qr{margin:14px auto 2px;width:216px;max-width:100%;padding:10px;border-radius:12px;background:#fff}
.qr canvas{width:100%;height:auto;display:block;image-rendering:pixelated}

.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:6px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 6px 11px;border-radius:11px;background:var(--card2);border:1px solid var(--bd);font-size:12.5px;font-weight:600;touch-action:manipulation;transition:background .2s}
.app:hover{background:var(--bd)}

.cf.pro .bdg{background:var(--warn)}
.cf .ix{flex:none;color:var(--ac)}
.cf .nm{flex:1;min-width:0}
.cf .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}
.cf .nm small{display:block;font-size:11px;color:var(--mut);margin-top:2px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.html-rtl .nm small{text-align:start}
.cp{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:color .2s,background .2s;touch-action:manipulation}
.cp:hover{color:var(--fg)}
.cp.ok{background:rgba(34,197,94,.14);color:var(--ok);border-color:rgba(34,197,94,.4)}
.empty{text-align:center;color:var(--mut);font-size:13px;line-height:1.9;padding:14px 6px}
/* help */
details{border-top:1px solid var(--bd);padding:12px 2px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
summary::-webkit-details-marker{display:none}
summary .n{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:11px;background:var(--card2);border:1px solid var(--bd);color:var(--mut)}
summary .ar{margin-inline-start:auto;flex:none;color:var(--mut);transition:transform .25s}
details[open] summary .ar{transform:rotate(180deg)}
.dc{font-size:13px;line-height:2;color:var(--mut);padding-top:7px;padding-inline-start:32px}
.dc code{direction:ltr;unicode-bidi:isolate;font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--bd);color:var(--fg);word-break:break-all}

.tgw{display:grid;gap:12px}
.tgc{display:flex;align-items:center;gap:12px;padding:13px 16px;transition:background .2s}

.foot b{font-weight:700;color:var(--fg)}
/* sheet + toast */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}

.sheet{width:100%;max-width:440px;margin:0 10px max(10px,env(safe-area-inset-bottom));border-radius:16px;padding:18px;background:var(--card);border:1px solid var(--bd);transform:translate3d(0,30px,0);transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:center}

.sheet .qr{width:250px;margin:0 auto 14px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));z-index:60;transform:translate3d(-50%,-160%,0);display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:11px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600;box-shadow:0 14px 34px -10px rgba(0,0,0,.55);transition:transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:90vw}
.toast.on{transform:translate3d(-50%,0,0)}
.toast .o{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(34,197,94,.16);color:var(--ok)}

/* desktop */
@media(min-width:760px){
 .wrap{padding-top:34px;gap:16px}
 .top{grid-template-columns:1.9fr 1fr}
 .side{grid-template-columns:1fr}
 .main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"cfg sub" "cfg apps" "cfg help" "cfg tg";grid-template-rows:auto auto auto 1fr;align-items:start}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
